name: call_screen
description: "Call screen wake lock and lockscreen unlock plugin for ustaapp"
version: 0.0.1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

flutter:
  plugin:
    platforms:
      android:
        package: com.example.call_screen
        pluginClass: CallScreenPlugin
